name: Site checks

# The same checks as .githooks/, for pushes that skipped or never had the hooks.
on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Nature capital real estate
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Site rules
        run: python scripts/check_site.py
      - name: Pushed commits (paths, messages, whitespace)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No earlier commit to compare with; skipped."
            exit 0
          fi
          git diff --check "$BASE" HEAD
          python scripts/check_site.py --range "$BASE"
      - name: Links
        run: python scripts/check_links.py
      - name: Tests
        run: |
          for suite in test_check_links.py test_check_site.py test_forest_data.py test_worklane.py; do
            python -m unittest discover -s tests -p "$suite"
          done
