# compose.yaml のローカル確認用サーバ
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # 編集をすぐ反映させるためキャッシュさせない
  add_header Cache-Control "no-store";
  sendfile off;

  # GitHub Pages と同じパス(404.html の <base href> がこれを前提にしている)
  location /fudousanbusiness-jgx/ {
    alias /usr/share/nginx/html/;
    error_page 404 /fudousanbusiness-jgx/404.html;
  }

  # 撮影用: パスワードゲートを外した同じページ。auth.js だけ空にする
  location = /__preview/auth.js {
    default_type application/javascript;
    return 200 "";
  }
  location /__preview/ {
    alias /usr/share/nginx/html/;
  }

  error_page 404 /404.html;
}
