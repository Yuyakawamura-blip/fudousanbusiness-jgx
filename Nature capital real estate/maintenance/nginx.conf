# compose.yaml のローカル確認用サーバ
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # 編集をすぐ反映させるためキャッシュさせない
  add_header Cache-Control "no-store";
  sendfile off;

  # GitHub Pages と同じパス(404.html の <base href> がこれを前提にしている)
  location /fudousanbusiness-jgx/ {
    alias /usr/share/nginx/html/;
    error_page 404 /fudousanbusiness-jgx/404.html;
  }

  # 撮影用: パスワードゲートを外した同じページ。auth.js だけ空にする
  location = /__preview/auth.js {
    default_type application/javascript;
    return 200 "";
  }
  # 404.html は <base href="/fudousanbusiness-jgx/"> で本物の auth.js を読むので、撮影用では基準を /__preview/ に書き換える
  location = /__preview/404.html {
    alias /usr/share/nginx/html/404.html;
    sub_filter '<base href="/fudousanbusiness-jgx/" />' '<base href="/__preview/" />';
    sub_filter_once on;
  }
  location /__preview/ {
    alias /usr/share/nginx/html/;
  }

  error_page 404 /404.html;
}
